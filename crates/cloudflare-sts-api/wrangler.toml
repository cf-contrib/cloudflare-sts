# The Worker under `wrangler dev`: the integration tests' setup, as
# cloudflare-nix's is. A `stand-ins` build takes Cloudflare's API from the tests'
# stand-ins, and its policy's providers are the stand-ins' issuers, which the
# tests serve on 127.0.0.1:8791 while they run. tests/run.sh creates the
# secrets in a local store and runs the tests against it. Releases are built
# without `stand-ins`, and deployed with deployment/terraform.
name = "cloudflare-sts-api"
main = "build/index.js"
compatibility_date = "2026-08-15"

[build]
command = "worker-build --dev --features stand-ins"

# The policy's issuer and providers' audience.
[dev]
port = 8790

[observability]
enabled = true

[triggers]
crons = ["17 * * * *"] # hourly cleanup of expired cloudflare-sts:* tokens

[vars]
CLOUDFLARE_STS_API_ACCOUNT_ID = "0123456789abcdef0123456789abcdef"
CLOUDFLARE_STS_API_CLOUDFLARE_URL = "http://127.0.0.1:8791/cloudflare/client/v4"

# The policy: tests/config.toml and tests/policy.cedar, which tests/run.sh puts
# in the local KV namespace as the keys `config` and `policy`. `mismatched`'s discovery document names another issuer, and so
# does `pinned`'s, whose keys are at its jwks_uri. `typed` takes only access
# tokens, which the stand-ins don't sign. `access` is where people sign in,
# shaped like an Access for SaaS OIDC app: its audience is its client ID.
[[kv_namespaces]]
binding = "CLOUDFLARE_STS_API_POLICY_KV"
id = "00000000000000000000000000000000"

# Secrets Store only: a plain `wrangler secret` is refused.
[[secrets_store_secrets]]
binding = "CLOUDFLARE_STS_API_CLOUDFLARE_TOKEN"
store_id = "00000000000000000000000000000000"
secret_name = "cloudflare-token"

[[secrets_store_secrets]]
binding = "CLOUDFLARE_STS_API_SIGNING_KEY"
store_id = "00000000000000000000000000000000"
secret_name = "signing-key"
