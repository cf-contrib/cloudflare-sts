openapi: 3.1.0
info:
  title: cloudflare-sts
  description: |-
    Bodies are form-encoded, at most 16 KiB, and errors are OAuth errors (RFC 6749 §5.2),
    as RFC 8693 and RFC 7009 have it. Every response is `Cache-Control: no-store`, but
    the discovery endpoints' `200`s.

    Exchanges an OIDC token for short-lived Cloudflare credentials (RFC 8693 token exchange
    at `POST /oauth/token`), and revokes them (RFC 7009 at `POST /oauth/revoke`). Clients
    find the endpoints through its metadata (RFC 8414).
  version: v1
tags:
  - name: DiscoveryService
    description: The broker's metadata, public, for clients that find its endpoints.
  - name: TokenService
    description: 'Token exchange and revocation: the OAuth token and revocation endpoints.'
paths:
  /.well-known/oauth-authorization-server:
    get:
      operationId: metadata
      summary: The broker's Authorization Server Metadata (RFC 8414), with its endpoints.
      description: Tokens come from exchange only, so there's no authorization endpoint.
      parameters: []
      responses:
        '200':
          description: The metadata. Cacheable for 5 minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationServerMetadata'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - DiscoveryService
  /oauth/revoke:
    post:
      operationId: revokeToken
      summary: Revoke a Cloudflare API token the broker minted.
      description: |-
        Holding the token is the proof. Answers `200` whether the token was revoked, already
        gone, never valid, or not one the broker minted, which it never deletes: to the
        broker, that's an invalid token, which RFC 7009 §2.2 answers with `200` too.
      parameters: []
      responses:
        '200':
          description: Revoked, already gone, never valid, or not the broker's. No body.
        '400':
          description: |-
            The caller's mistake: the description says what was wrong. A request that doesn't fit
            this contract, such as a JSON body, is `invalid_request` too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloudflare or the subject token's issuer failed (`temporarily_unavailable`); the broker's logs say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - TokenService
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRevocationRequest'
  /oauth/token:
    post:
      operationId: exchangeToken
      summary: Exchange an OIDC token for a Cloudflare API token and/or R2 credentials.
      description: |-
        The subject token is in the body, not an `Authorization` header. Which profiles
        apply follows the policy: every profile named in `scope` must match the caller,
        otherwise exactly one profile must. Anything unsupported, such as `actor_token`, is
        refused rather than ignored. An invalid subject token, or one the policy doesn't take,
        is `invalid_request`, as RFC 8693 §2.2.2 has it; a `requested_token_type` the broker
        doesn't issue is `invalid_target`, and a `scope` that names an unknown profile, or one
        the caller can't have, or profiles that can't be combined, is `invalid_scope`.
      parameters: []
      responses:
        '200':
          description: Issued. A profile with only a bucket returns no `access_token` and `token_type` `N_A`.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenExchangeResponse'
        '400':
          description: |-
            The caller's mistake: the description says what was wrong. A request that doesn't fit
            this contract, such as a JSON body, is `invalid_request` too.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: The broker is misconfigured or failed (`server_error`); its logs say why.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Cloudflare or the subject token's issuer failed (`temporarily_unavailable`); the broker's logs say which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
        - TokenService
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenExchangeRequest'
components:
  schemas:
    AccessCredentials:
      type: object
      required:
        - token_id
        - client_id
        - client_secret
        - audience
        - expires_on
      properties:
        token_id:
          type: string
          description: The service token's ID, which revoking it takes.
        client_id:
          type: string
        client_secret:
          type: string
        audience:
          type: string
          description: "The application the token is for: the profile's `access.audience`."
        expires_on:
          type: string
          format: date-time
      description: |-
        A Cloudflare Access service token for the profile's `access.audience`: sent as the
        `CF-Access-Client-Id` and `CF-Access-Client-Secret` headers. It's created for the job
        and deleted by revoking it. Cloudflare takes a moment, a few seconds, to honor a
        new one.
    AuthorizationServerMetadata:
      type: object
      required:
        - issuer
        - token_endpoint
        - revocation_endpoint
        - response_types_supported
        - grant_types_supported
      properties:
        issuer:
          type: string
          description: Exactly the `iss` of the broker's tokens, so no trailing slash.
        token_endpoint:
          type: string
          format: uri
        revocation_endpoint:
          type: string
          format: uri
        response_types_supported:
          type: array
          items:
            type: string
          description: Empty, since there's no authorization endpoint for a response type to be for.
        grant_types_supported:
          type: array
          items:
            type: string
          description: 'Token exchange only: `urn:ietf:params:oauth:grant-type:token-exchange`.'
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: "`none`: callers don't authenticate as clients; the subject token is the proof."
        revocation_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
          description: '`none`: holding the token is the proof.'
      description: Authorization Server Metadata (RFC 8414 §2).
    BucketCredentials:
      type: object
      required:
        - name
        - access_key_id
        - secret_access_key
        - session_token
        - prefixes
        - endpoint
        - expires_on
      properties:
        name:
          type: string
        access_key_id:
          type: string
        secret_access_key:
          type: string
        session_token:
          type: string
        prefixes:
          type: array
          items:
            type: string
          description: Filled in from the caller's claims. Empty means the whole bucket.
        endpoint:
          type: string
          description: '`https://<account_id>.r2.cloudflarestorage.com`'
        expires_on:
          type: string
          format: date-time
      description: S3 credentials for the profile's R2 bucket, limited to `prefixes`. They can't be revoked; they expire.
    Error:
      type: object
      required:
        - error
        - error_description
      properties:
        error:
          $ref: '#/components/schemas/ErrorCode'
        error_description:
          type: string
          description: What went wrong.
      description: An OAuth error response (RFC 6749 §5.2).
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_scope
        - invalid_target
        - unsupported_grant_type
        - server_error
        - temporarily_unavailable
      description: |-
        RFC 6749's error codes (§5.2, and §4.1.2.1 for the broker's own faults) and RFC
        8693's `invalid_target`.
    IssuedTokenType:
      type: string
      enum:
        - urn:ietf:params:oauth:token-type:access_token
        - urn:cloudflare-sts:params:oauth:token-type:r2_credentials
        - urn:cloudflare-sts:params:oauth:token-type:access_service_token
      description: |-
        What the exchange issues: a Cloudflare API token (`access_token`), R2 credentials
        alone (`r2_credentials`), or an Access service token alone (`access_service_token`).
    TokenExchangeRequest:
      type: object
      required:
        - grant_type
        - subject_token
        - subject_token_type
      properties:
        grant_type:
          type: string
          enum:
            - urn:ietf:params:oauth:grant-type:token-exchange
        subject_token:
          type: string
          minLength: 1
          maxLength: 8192
          description: An OIDC token from an issuer the policy names as a provider.
        subject_token_type:
          type: string
          enum:
            - urn:ietf:params:oauth:token-type:id_token
            - urn:ietf:params:oauth:token-type:jwt
          description: An OIDC token, as `id_token` or `jwt`.
        requested_token_type:
          $ref: '#/components/schemas/IssuedTokenType'
          description: |-
            Checked, not used to choose: what's issued is what the profile has. `access_token`,
            `r2_credentials` or `access_service_token`. Any other is `invalid_target`.
        scope:
          type: string
          maxLength: 1024
          description: |-
            The profiles to get, as a space-delimited list (RFC 6749 §3.3, RFC 8693 §2.1). The
            caller must be allowed every one, or the request is `invalid_scope` and nothing is
            issued. Profiles are combined into one grant: their token policies together, and at
            most one bucket and one access. If omitted, exactly one profile must match.
        ttl:
          type: string
          maxLength: 16
          description: |-
            Requested lifetime such as `10m` or `1h`, capped at the profile's `max_ttl`. If
            omitted, the profile's `ttl`. Below `1m`, or unparseable, is `invalid_request`.
    TokenExchangeResponse:
      type: object
      required:
        - issued_token_type
        - token_type
        - expires_in
        - expires_at
        - scope
      properties:
        access_token:
          type: string
          description: The Cloudflare API token, absent for a profile with only a bucket or an access.
        issued_token_type:
          $ref: '#/components/schemas/IssuedTokenType'
          description: |-
            `access_token` with an `access_token`; without one, `r2_credentials` with a bucket or
            else `access_service_token`.
        token_type:
          type: string
          enum:
            - Bearer
            - N_A
          description: '`Bearer` with an `access_token`, or `N_A` without one (RFC 8693 §2.2.1).'
        expires_in:
          type: integer
          minimum: 0
          description: Seconds until the token, or the R2 credentials, expire.
        expires_at:
          type: integer
          description: 'When the token, or the R2 credentials, expire: Unix time in seconds.'
        token_id:
          type: string
          description: The Cloudflare API token's ID, present with `access_token`.
        account_id:
          type: string
          description: The Cloudflare account.
        scope:
          type: string
          description: The profiles that were granted, space-delimited (RFC 8693 §2.2.1).
        bucket:
          $ref: '#/components/schemas/BucketCredentials'
          description: The R2 credentials, for a profile with a bucket.
        access:
          $ref: '#/components/schemas/AccessCredentials'
          description: The Access service token, for a profile with `access`.
    TokenRevocationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 8192
          description: |-
            The Cloudflare API token, as the exchange returned it in `access_token`; or, with
            the `access_service_token` hint, the service token's ID (`access.token_id`).
        token_type_hint:
          type: string
          enum:
            - access_token
            - urn:cloudflare-sts:params:oauth:token-type:access_service_token
          description: |-
            `access_token` (the default, and ignored), or the `access_service_token` URN to
            revoke an Access service token. Only what the broker minted can be revoked.
servers:
  - url: https://cloudflare-sts-api.example.com
    variables: {}
